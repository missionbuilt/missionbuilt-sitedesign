<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>MealStack · click-through demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@600&display=swap" rel="stylesheet" />
<style>
/* ═══════════════════════════════════════════════════════════════════════
   MEALSTACK CLICK-THROUGH DEMO
   Real screens from a Debug build of MealStack in the iPhone 17 Simulator
   (dark appearance), shot with the build's demo clock set for each step.
   The Simulator's own clock is painted out of every image
   (scripts/build_mealstack_demo_images.py) and drawn here instead.
   The tour follows the four pillars from the Log "Fueling is training".
   The guide panel is Iron Log: charcoal, mono, oxblood.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --bg: #171513; --rule: #2a2622; --chalk: #ebe5d8; --chalk-dim: #a8a094; --chalk-faint: #8a847a; --blood: #a8211a; --blood-text: #e4564e;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --sys: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif;
  --pw: 402px; --ph: 874px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--chalk); -webkit-font-smoothing: antialiased; }
button { font: inherit; }

/* ── Stage ── */
.stage { height: 100%; display: flex; align-items: stretch; overflow: hidden; }
.phone-col { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 18px 8px 18px 22px; }
.guide { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: flex-start; padding: 40px 28px 24px 22px; border-left: 1px solid var(--rule); }

/* ── Phone ── */
.phone-scale { transform-origin: top left; }
.phone { width: calc(var(--pw) + 20px); height: calc(var(--ph) + 20px); border-radius: 58px; background: #000; padding: 10px; box-shadow: 0 0 0 1px #3a3530; }
.screen { position: relative; width: var(--pw); height: var(--ph); border-radius: 48px; overflow: hidden; background: #1c1b1a; }
.shot { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 180ms ease; user-select: none; -webkit-user-drag: none; }
.shot.on { opacity: 1; }
.clock { position: absolute; left: 36px; top: 19px; width: 78px; height: 26px; display: flex; align-items: center; justify-content: center;
  font-family: var(--sys); font-size: 17px; font-weight: 600; letter-spacing: -0.2px; color: #fff; pointer-events: none; z-index: 2; }

/* Hotspots: a pulsing ring on the thing to tap. */
@keyframes mb-pulse {
  0%, 100% { box-shadow: 0 0 0 2px #fffaeb, 0 0 0 5px #a8211a, 0 0 18px 4px rgba(168,33,26,0.55); }
  50%      { box-shadow: 0 0 0 2px #fffaeb, 0 0 0 7px #a8211a, 0 0 28px 8px rgba(168,33,26,0.70); }
}
.hot { position: absolute; border-radius: 12px; cursor: pointer; z-index: 3; background: none; border: none; padding: 0; animation: mb-pulse 1.6s ease-in-out infinite; }
.hot:focus-visible { outline: 2px solid #fffaeb; outline-offset: 4px; }

/* ── Guide panel ── */
.g-parts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
.g-part { background: none; border: 1px solid #3a342d; color: var(--chalk-dim); font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 9px; cursor: pointer; }
.g-part:hover { border-color: var(--blood); color: var(--chalk); }
.g-part.on { border-color: var(--blood); color: #fffaeb; background: rgba(168,33,26,0.18); }
.g-n { color: var(--blood-text); margin-right: 2px; }
.g-part.on .g-n { color: #fffaeb; }
.g-rule { font-family: 'Merriweather', Georgia, serif; font-style: italic; font-size: 14px; line-height: 1.55; color: var(--chalk-dim); margin: 10px 0 0; max-width: 48ch; padding-left: 12px; border-left: 2px solid var(--blood); }
.g-rule:empty { display: none; }
.g-counter { font-family: var(--mono); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--blood-text); }
.g-title { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #fffaeb; margin: 10px 0 0; }
.g-desc { font-family: 'Merriweather', Georgia, serif; font-size: 15px; line-height: 1.6; color: #c8bea7; margin: 12px 0 0; max-width: 48ch; }
.g-do { margin: 18px 0 0; font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--chalk); display: flex; align-items: center; gap: 10px; min-height: 18px; }
.g-do::before { content: ''; width: 7px; height: 7px; background: var(--blood); flex: 0 0 auto; }
.g-do:empty { display: none; }
.g-nav { display: flex; align-items: center; gap: 10px; margin-top: 22px; }
.g-btn { background: none; border: 1px solid #3a342d; color: #fffaeb; font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; padding: 8px 16px; cursor: pointer; transition: border-color 120ms, color 120ms; }
.g-btn:hover { border-color: var(--blood-text); color: var(--blood-text); }
.g-btn:disabled { opacity: .4; cursor: default; }
.g-btn.primary { border-color: var(--blood); background: var(--blood); }
.g-btn.primary:hover { background: #c02a20; border-color: #c02a20; color: #fffaeb; }
.g-fine { margin-top: 26px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--chalk-faint); line-height: 1.6; max-width: 60ch; }

@media (max-width: 720px) {
  .stage { flex-direction: column; overflow-y: auto; }
  .phone-col { order: 2; padding: 10px 0 14px; }
  .guide { order: 1; border-left: none; border-bottom: 1px solid var(--rule); padding: 14px 18px 16px; justify-content: flex-start; }
  .g-parts { margin-bottom: 12px; padding-right: 96px; }
  .g-desc { font-size: 13px; line-height: 1.5; margin-top: 8px; }
  .g-title { margin-top: 6px; }
  .g-rule { font-size: 12px; margin-top: 6px; }
  .g-nav { margin-top: 12px; }
  .g-fine { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .hot { animation: none; box-shadow: 0 0 0 2px #fffaeb, 0 0 0 5px #a8211a; }
  .shot { transition: none; }
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone-col">
    <div class="phone-scale" id="scale">
      <div class="phone">
        <div class="screen" id="screen" role="img" aria-live="polite">
          <img class="shot on" id="shot-a" alt="" />
          <img class="shot" id="shot-b" alt="" />
          <div class="clock" id="clock" aria-hidden="true"></div>
          <div id="targets"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="guide" id="guide">
    <div class="g-parts" id="g-parts" aria-label="Parts of the tour"></div>
    <div class="g-counter" id="g-counter"></div>
    <p class="g-rule" id="g-rule"></p>
    <p class="g-title" id="g-title"></p>
    <p class="g-desc" id="g-desc"></p>
    <p class="g-do" id="g-do"></p>
    <div class="g-nav">
      <button class="g-btn" id="g-prev">← Prev</button>
      <button class="g-btn primary" id="g-next">Next →</button>
    </div>
    <p class="g-fine">Real screens from a Debug build of MealStack 0.9.1 in the iPhone Simulator, with the build’s demo clock set for each step. Four pillars, a few screens each. Tap the ringed spot, use the buttons, or ← → on the keyboard.</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  var IMG = 'mealstack/';
  // Screen boxes are in points on the 402 × 874 screen: [left, top, right, bottom].
  var HISTORY_TAB = [212, 795, 300, 848];

  // The tour is the four pillars from the Log "Fueling is training", two to four screens each.
  var PILLARS = {
    protein: { n: '01', name: 'Protein', label: 'Protect the protein',
      rule: 'Protein has no storage tank. Stack it across the day, and never send it out alone.' },
    session: { n: '02', name: 'Session', label: 'Protect the session',
      rule: 'Your pre-workout meal is equipment, not a snack. It anchors backward from when you train and holds its time.' },
    day:     { n: '03', name: 'Day', label: 'Protect the day',
      rule: 'Flights, time zones, a session that moved to 8pm. Change the day, swap the plate, keep going.' },
    record:  { n: '04', name: 'Record', label: 'Protect the record',
      rule: 'Log when you eat, not when it was due.' }
  };

  var steps = [
    { part: 'intro', img: '00-welcome', clock: '6:40', title: 'Fueling is training.',
      desc: 'A meal timing tracker for people who train. It rests on four pillars: protect the protein, the session, the day and the record. This tour shows each one in a few real screens. About a minute.' },

    // ── 01 Protein ──
    { part: 'protein', img: '04-today-morning', clock: '6:40', title: 'The next meal is the screen',
      desc: 'The day is a stack of meals, spaced out. The next one is the biggest thing on Today, counting down, with what’s on the plate and its protein. An alert finds you when it’s due.' },
    { part: 'protein', img: '21-stack-detail', clock: '6:42', title: 'Planned plate by plate',
      hot: [18, 600, 384, 688], doText: 'Tap Paprika chicken box',
      desc: 'A stack is a training day and a rest day of meals. The Base puts 224 g of protein across the training day, and every plate shows its share.' },
    { part: 'protein', img: '22-meal-editor', clock: '6:42', title: 'Weighed, not guessed',
      desc: 'A meal is its ingredients, by weight, with their macros. The meal’s totals and the day’s update as you edit. Fuel, like the shake after the session, counts its protein toward the day but never counts as a meal.' },

    // ── 02 Session ──
    { part: 'session', img: '08-session-menu', clock: '7:06', title: 'The session is the anchor',
      hot: [60, 308, 300, 354], doText: 'Tap “30 min later”',
      desc: 'Say when you train and the day is built around it: the carb surge, the pre-workout scoop and the jug are pinned to the session. Training moved? Move it here, and each choice shows where it lands.' },
    { part: 'session', img: '09-session-moved', clock: '7:07', title: 'What’s pinned moves with it',
      desc: 'Session 6:30 PM. The carb surge, the scoop and the jug moved with it; the morning didn’t. One line says what moved, with Undo. No “are you sure?” dialogs.' },
    { part: 'session', img: '11-late-log', clock: '12:40', title: 'The carb surge holds',
      desc: 'It’s 12:40 and the 10:06 yogurt is only happening now. The rest of the day slides, except where it would crowd the session: lunch tightens to 3:00 so the carb surge still lands at 5:00, before you train.' },

    // ── 03 Day ──
    { part: 'day', img: '13-not-yet-menu', clock: '12:40', title: 'Can’t eat it as planned?',
      hot: [78, 438, 324, 492], doText: 'Tap “Swap for another meal”',
      desc: '“Not yet” under every meal: push it back 15, 30 or 45 minutes, skip it, or swap it. Prepped lunch sitting in a fridge in another city? Swap.' },
    { part: 'day', img: '14-swap-shelf', clock: '12:40', title: 'Swap from your shelf',
      desc: 'Your Meals shelf opens for this plate. Pick one for today only, for this stack, or for every stack. The day around it doesn’t have to be rebuilt.' },
    { part: 'day', img: '16-coach-eating-out', clock: '12:41', title: 'Eating out? Send Coach the menu',
      desc: 'Snap the menu or paste a link. Coach picks what fits this meal’s numbers, for today only. Coach is an AI and can be wrong, so nothing changes until you tap its card.' },
    { part: 'day', img: '27-daytype-menu', clock: '9:45', title: 'Rest day, today only',
      desc: 'The day went sideways? Flip it to rest from the top of Today; tomorrow follows your training days. Next to it, the stack menu changes the week’s meals in one tap.' },

    // ── 04 Record ──
    { part: 'record', img: '06-log-sheet', clock: '7:06', title: 'Log when you ate',
      desc: 'The sheet opens on now, with 15 min ago, 1 hr ago and the planned time a tap away, and shows what the rest of the day will do before you commit.' },
    { part: 'record', img: '19d-nothing-fits', clock: '9:45', title: 'No pretending',
      hot: HISTORY_TAB, doText: 'Tap History',
      desc: '9:45 PM, past the 9:30 last meal. What can’t happen says so: log what you did eat, or skip the rest in one tap. Nothing gets pushed onto tomorrow, and there are no streaks to protect.' },
    { part: 'record', img: '26-history', clock: '9:45', title: 'The day as it happened',
      desc: 'History keeps the real day: carb surge missed, the yogurt 2 hr 34 min late, 177 g of protein. Tomorrow gets tuned on that, not on the plan. That’s MealStack. It’s in private beta on iPhone; the form under this demo gets you a build.' }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var order = ['protein', 'session', 'day', 'record'];
  var firstOf = {};
  steps.forEach(function (s, i) { if (firstOf[s.part] === undefined) firstOf[s.part] = i; });

  // Preload, so a tap swaps the screen at once.
  var cache = {};
  steps.forEach(function (s) { if (!cache[s.img]) { var im = new Image(); im.src = IMG + s.img + '.webp'; cache[s.img] = im; } });

  var cur = -1, front = 'shot-a';
  function swapImage(name, label) {
    var src = IMG + name + '.webp';
    var a = $(front);
    if (a.getAttribute('src') === src) { a.alt = label; return; }
    var backId = front === 'shot-a' ? 'shot-b' : 'shot-a', b = $(backId);
    b.src = src; b.alt = label;
    b.classList.add('on'); a.classList.remove('on');
    front = backId;
  }
  function box(el, r) {
    el.style.left = r[0] + 'px'; el.style.top = r[1] + 'px';
    el.style.width = (r[2] - r[0]) + 'px'; el.style.height = (r[3] - r[1]) + 'px';
  }
  function renderTargets(s) {
    var t = $('targets');
    t.innerHTML = '';
    if (!s.hot) return;
    var h = document.createElement('button');
    h.className = 'hot';
    h.setAttribute('aria-label', s.doText || 'Continue');
    box(h, s.hot);
    h.addEventListener('click', next);
    t.appendChild(h);
  }
  function renderParts(s) {
    var wrap = $('g-parts');
    if (!wrap.childElementCount) {
      order.forEach(function (k) {
        var b = document.createElement('button');
        b.className = 'g-part';
        b.innerHTML = '<span class="g-n">' + PILLARS[k].n + '</span> ' + PILLARS[k].name;
        b.setAttribute('aria-label', 'Pillar ' + PILLARS[k].n + ': ' + PILLARS[k].label);
        b.addEventListener('click', function () { goTo(firstOf[k]); });
        wrap.appendChild(b);
      });
    }
    Array.prototype.forEach.call(wrap.children, function (b, i) { b.classList.toggle('on', order[i] === s.part); });
  }
  function goTo(n) {
    if (n < 0 || n >= steps.length) return;
    cur = n;
    var s = steps[n], p = PILLARS[s.part];
    swapImage(s.img, s.title);
    $('clock').textContent = s.clock;
    renderTargets(s);
    renderParts(s);
    if (p) {
      var inPart = steps.filter(function (x) { return x.part === s.part; }).length;
      $('g-counter').textContent = 'Pillar ' + p.n + ' · ' + p.label + ' · ' + (n - firstOf[s.part] + 1) + ' of ' + inPart;
      $('g-rule').textContent = p.rule;
    } else {
      $('g-counter').textContent = 'MealStack · four pillars';
      $('g-rule').textContent = '';
    }
    $('g-title').textContent = s.title;
    $('g-desc').textContent = s.desc;
    $('g-do').textContent = s.doText || '';
    $('g-prev').disabled = n === 0;
    $('g-next').textContent = n === 0 ? 'Start →' : n === steps.length - 1 ? 'Start over' : (s.hot ? 'Do it for me →' : 'Next →');
    if (window.innerWidth <= 720) fit();
  }
  function next() { goTo(cur === steps.length - 1 ? 0 : cur + 1); }
  function prev() { goTo(cur - 1); }

  $('g-prev').addEventListener('click', prev);
  $('g-next').addEventListener('click', next);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });

  /* ── Fit the phone to the frame ── */
  var PW = 422, PH = 894;
  function fit() {
    var col = document.querySelector('.phone-col'), narrow = window.innerWidth <= 720;
    var guideH = narrow ? $('guide').offsetHeight : 0;
    var availH = narrow ? Math.max(380, window.innerHeight - guideH - 28) : window.innerHeight - 36;
    var availW = narrow ? window.innerWidth - 24 : Math.min(window.innerWidth * 0.48, 450) - 30;
    var k = Math.min(availH / PH, availW / PW, 1), sc = $('scale');
    sc.style.transform = 'scale(' + k + ')'; sc.style.width = (PW * k) + 'px'; sc.style.height = (PH * k) + 'px';
    col.style.flexBasis = narrow ? 'auto' : (PW * k + 30) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
  goTo(0);
})();
</script>
</body>
</html>
