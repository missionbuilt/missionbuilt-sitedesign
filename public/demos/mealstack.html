<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>MealStack · click-through demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@600&display=swap" rel="stylesheet" />
<style>
/* ═══════════════════════════════════════════════════════════════════════
   MEALSTACK CLICK-THROUGH DEMO
   Real screens from a Debug build of MealStack in the iPhone 17 Simulator
   (dark appearance), shot with the build's demo clock set for each step.
   The Simulator's own clock is painted out of every image
   (scripts/build_mealstack_demo_images.py) and drawn here instead.
   The guide panel is Iron Log: charcoal, mono, oxblood.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --bg: #171513; --rule: #2a2622; --chalk: #ebe5d8; --chalk-dim: #a8a094; --chalk-faint: #5a564f; --blood: #a8211a;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --sys: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif;
  --pw: 402px; --ph: 874px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--chalk); -webkit-font-smoothing: antialiased; }
button { font: inherit; }

/* ── Stage ── */
.stage { height: 100%; display: flex; align-items: stretch; overflow: hidden; }
.phone-col { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 18px 8px 18px 22px; }
.guide { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 24px 28px 24px 22px; border-left: 1px solid var(--rule); }

/* ── Phone ── */
.phone-scale { transform-origin: top left; }
.phone { width: calc(var(--pw) + 20px); height: calc(var(--ph) + 20px); border-radius: 58px; background: #000; padding: 10px; box-shadow: 0 0 0 1px #3a3530; }
.screen { position: relative; width: var(--pw); height: var(--ph); border-radius: 48px; overflow: hidden; background: #1c1b1a; }
.shot { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 180ms ease; user-select: none; -webkit-user-drag: none; }
.shot.on { opacity: 1; }
.clock { position: absolute; left: 36px; top: 19px; width: 78px; height: 26px; display: flex; align-items: center; justify-content: center;
  font-family: var(--sys); font-size: 17px; font-weight: 600; letter-spacing: -0.2px; color: #fff; pointer-events: none; z-index: 2; }

/* Hotspots: a pulsing ring on the thing to tap. Invisible tab targets sit on the tab bar. */
@keyframes mb-pulse {
  0%, 100% { box-shadow: 0 0 0 2px #fffaeb, 0 0 0 5px #a8211a, 0 0 18px 4px rgba(168,33,26,0.55); }
  50%      { box-shadow: 0 0 0 2px #fffaeb, 0 0 0 7px #a8211a, 0 0 28px 8px rgba(168,33,26,0.70); }
}
.hot { position: absolute; border-radius: 12px; cursor: pointer; z-index: 3; background: none; border: none; padding: 0; animation: mb-pulse 1.6s ease-in-out infinite; }
.hot:focus-visible { outline: 2px solid #fffaeb; outline-offset: 4px; }
.tab { position: absolute; top: 795px; height: 53px; z-index: 3; cursor: pointer; background: none; border: none; padding: 0; border-radius: 26px; }
.tab:hover { background: rgba(255,250,235,0.06); }

/* ── Guide panel ── */
.g-parts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
.g-part { background: none; border: 1px solid #3a342d; color: var(--chalk-dim); font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 9px; cursor: pointer; }
.g-part:hover { border-color: var(--blood); color: var(--chalk); }
.g-part.on { border-color: var(--blood); color: #fffaeb; background: rgba(168,33,26,0.18); }
.g-counter { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--blood); }
.g-title { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #fffaeb; margin: 10px 0 0; }
.g-desc { font-family: 'Merriweather', Georgia, serif; font-size: 15px; line-height: 1.6; color: #c8bea7; margin: 12px 0 0; max-width: 48ch; }
.g-do { margin: 18px 0 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--chalk); display: flex; align-items: center; gap: 10px; min-height: 18px; }
.g-do::before { content: ''; width: 7px; height: 7px; background: var(--blood); flex: 0 0 auto; }
.g-do:empty { display: none; }
.g-nav { display: flex; align-items: center; gap: 10px; margin-top: 22px; }
.g-btn { background: none; border: 1px solid #3a342d; color: #fffaeb; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; padding: 8px 16px; cursor: pointer; transition: border-color 120ms, color 120ms; }
.g-btn:hover { border-color: var(--blood); color: var(--blood); }
.g-btn:disabled { opacity: .4; cursor: default; }
.g-btn.primary { border-color: var(--blood); background: var(--blood); }
.g-btn.primary:hover { background: #c02a20; border-color: #c02a20; color: #fffaeb; }
.g-fine { margin-top: 26px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--chalk-faint); line-height: 1.6; max-width: 60ch; }

@media (max-width: 720px) {
  .stage { flex-direction: column; overflow-y: auto; }
  .phone-col { order: 2; padding: 10px 0 14px; }
  .guide { order: 1; border-left: none; border-bottom: 1px solid var(--rule); padding: 14px 18px 16px; justify-content: flex-start; }
  .g-parts { margin-bottom: 12px; padding-right: 96px; }
  .g-desc { font-size: 13px; line-height: 1.5; margin-top: 8px; }
  .g-title { margin-top: 6px; }
  .g-nav { margin-top: 12px; }
  .g-fine { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .hot { animation: none; box-shadow: 0 0 0 2px #fffaeb, 0 0 0 5px #a8211a; }
  .shot { transition: none; }
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone-col">
    <div class="phone-scale" id="scale">
      <div class="phone">
        <div class="screen" id="screen" role="img" aria-live="polite">
          <img class="shot on" id="shot-a" alt="" />
          <img class="shot" id="shot-b" alt="" />
          <div class="clock" id="clock" aria-hidden="true"></div>
          <div id="targets"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="guide" id="guide">
    <div class="g-parts" id="g-parts" aria-label="Parts of the tour"></div>
    <div class="g-counter" id="g-counter"></div>
    <p class="g-title" id="g-title"></p>
    <p class="g-desc" id="g-desc"></p>
    <p class="g-do" id="g-do"></p>
    <div class="g-nav">
      <button class="g-btn" id="g-prev">← Prev</button>
      <button class="g-btn primary" id="g-next">Next →</button>
    </div>
    <p class="g-fine">Real screens from a Debug build of MealStack 0.9.1 in the iPhone Simulator, with the build's demo clock set for each step. Coach can't answer from the Simulator, so the tour stops at its door. Tap the ringed spot, use the buttons, or ← → on the keyboard. The tab bar works.</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  var IMG = 'mealstack/';
  // Screen boxes are in points on the 402 × 874 screen: [left, top, right, bottom].
  var LOG_BAR = [22, 780, 382, 830];
  var TABS = { today: [25, 125], plan: [125, 212], history: [212, 300], coach: [318, 384] };

  var steps = [
    // ── Set up ──
    { id: 'setup', part: 'Set up', img: '00-welcome', clock: '6:40', title: 'Four ways in', tabs: false,
      hot: [20, 380, 382, 490], doText: 'Tap “Just the times”',
      desc: 'First open. Give it your times and fill the plates later, let Coach build the plan in a short chat, build it by hand, or bring a plan file a coach or Claude wrote. No account either way.' },
    { part: 'Set up', img: '01-quickstart', clock: '6:40', title: 'Two answers', tabs: false,
      hot: LOG_BAR, doText: 'Tap “Build my plan”',
      desc: 'When you eat first and when you train. The morning chains forward from the first meal; the carb surge, the session and everything after it are pinned to the session. The app asks to send alerts after this, not before.' },
    { id: 'today', part: 'Set up', img: '04-today-morning', clock: '6:40', title: 'Today',
      hot: [262, 118, 362, 146], doText: 'Tap the stack menu, “The Base”',
      desc: 'The next meal is the biggest thing on the screen, counting down. Across the top are three menus: the day type, the session, and the stack. A stack is a named set of meals for a training day and a rest day.' },
    { part: 'Set up', img: '03-stack-menu', clock: '6:40', title: 'One stack a week', tabs: false,
      hot: [118, 194, 300, 230], doText: 'Tap “The Base”',
      desc: 'Your rotation runs one stack per calendar week and repeats. Kept stacks wait on the shelf. Picking one runs it for the rest of this week, and what you’ve already eaten stays logged.' },
    { part: 'Set up', img: '02-stack-switched', clock: '6:40', title: 'One line, with Undo',
      desc: 'Every change says what it did in one line at the bottom, with Undo. There are no “are you sure?” dialogs anywhere in the app.' },
    { part: 'Set up', img: '05-today-list', clock: '6:41', title: 'The day, laid out', tabs: false,
      desc: 'The thin red line is now; the white line is the session. Meals above it follow whatever you ate last. The carb surge is pinned to the session. Fuel, like the scoop and the jug, is its own row and never counts as a meal.' },

    // ── Log ──
    { id: 'log', part: 'Log a meal', img: '06-log-sheet', clock: '7:06', title: 'Log when you ate', tabs: false,
      hot: LOG_BAR, doText: 'Tap “Log at 7:06 AM”',
      desc: 'Tap Log on the next meal. The sheet opens on now, with the common answers one tap away, and shows what the rest of the day does before you commit: the yogurt and lunch slide six minutes, the carb surge holds.' },
    { part: 'Log a meal', img: '07-logged-undo', clock: '7:06', title: 'On the record',
      hot: [110, 118, 242, 146], doText: 'Tap “Session 6:00 PM”',
      desc: 'Breakfast is logged at 7:06. A plate fills in the bar, “Since last” starts counting, and the line at the bottom can still take it back.' },
    { part: 'Log a meal', img: '08-session-menu', clock: '7:06', title: 'Training moved', tabs: false,
      hot: [60, 308, 300, 354], doText: 'Tap “30 min later”',
      desc: 'Mark the session done, or move it: an hour or thirty minutes either way, or pick a time. Each step shows where it lands, and a move that would leave today isn’t offered.' },
    { part: 'Log a meal', img: '09-session-moved', clock: '7:07', title: 'What’s pinned moves with it',
      desc: 'Session 6:30 PM. The carb surge, the scoop and the jug move with it; the morning doesn’t. The line says exactly what moved.' },

    // ── A late morning ──
    { id: 'late', part: 'A late morning', img: '10-late-morning', clock: '12:40', title: 'Two and a half hours late',
      hot: [20, 448, 382, 498], doText: 'Tap Log',
      desc: 'It’s 12:40. A meeting ran long and the yogurt never happened. Only the small label turns red: overdue, 2 hr 34 min.' },
    { part: 'A late morning', img: '11-late-log', clock: '12:40', title: 'The session is protected', tabs: false,
      hot: LOG_BAR, doText: 'Tap “Log at 12:40 PM”',
      desc: 'Three hours after 12:40 would put lunch at 3:40, too close to the carb surge. So the gap tightens and lunch moves to 3:00. The carb surge holds at 5:00.' },
    { part: 'A late morning', img: '12-late-logged', clock: '12:40', title: 'Running late, in words',
      hot: [150, 508, 252, 542], doText: 'Tap “Not yet”',
      desc: '“Running late. The gaps tightened so the carb surge still lands before your session.” Lunch is next, at 3:00.' },
    { part: 'A late morning', img: '13-not-yet-menu', clock: '12:40', title: 'Not yet', tabs: false,
      hot: [78, 438, 324, 492], doText: 'Tap “Swap for another meal”',
      desc: 'Push the meal back 15, 30 or 45 minutes, skip it, or swap it for another meal.' },
    { part: 'A late morning', img: '14-swap-shelf', clock: '12:40', title: 'Swap from your shelf', tabs: false,
      hot: [20, 82, 94, 118], doText: 'Tap Cancel',
      desc: 'Your Meals shelf opens for this meal. Pick one for today only, for this stack, or for every stack. Lunch is out with a client instead? Cancel, and ask Coach.' },

    // ── Coach ──
    { id: 'coach', part: 'Coach', img: '12-late-logged', clock: '12:41', title: 'Eating out',
      hot: [66, 554, 334, 582], doText: 'Tap “Eating out? Send Coach the menu”',
      desc: 'Under the next meal: “Eating out? Send Coach the menu.” It opens Coach with this meal in focus.' },
    { part: 'Coach', img: '15-coach-terms', clock: '12:41', title: 'Coach is an AI',
      hot: [22, 512, 382, 560], doText: 'Tap “I agree”',
      desc: 'The first time, three plain lines: not medical advice, menu numbers are estimates, and nothing changes until you tap. It says what gets sent, and asks you to confirm you’re 18 or older.' },
    { part: 'Coach', img: '16-coach-eating-out', clock: '12:41', title: 'Send the menu',
      hot: [240, 698, 268, 724], doText: 'Tap × on the pill',
      desc: 'The pill says what Coach is working on: eating out, in place of the Paprika chicken box. Snap the menu or paste a link. Coach picks what fits this meal’s numbers, for today only, and nothing lands until you tap its card.' },
    { id: 'coach-home', part: 'Coach', img: '17-coach-starters', clock: '12:41', title: 'Every conversation starts here',
      hot: [TABS.today[0], 795, TABS.today[1], 848], doText: 'Tap Today',
      desc: 'Starters head every new conversation, eating out first: fill the empty plates, work out your macros, ideas for the next meal, or say what’s in the fridge.' },

    // ── The evening ──
    { id: 'evening', part: 'The evening', img: '18-session-started-preview', clock: '7:20', title: 'The session started without it', tabs: false,
      hot: LOG_BAR, doText: 'Tap “Log at 7:20 PM”',
      desc: 'Later: it’s 7:20 PM and lunch finally happened. The carb surge and the scoop were due before the 6:30 session, which has started. They don’t slide past it; they’re marked “session started”. Only what comes after the session moves.' },
    { part: 'The evening', img: '19-evening-list', clock: '7:20', title: 'It says why', tabs: false,
      desc: 'Under the carb surge and the scoop: “Session started without it”, with Skip right there. If you did eat it, tap the box.' },
    { part: 'The evening', img: '19b-session-done', clock: '7:20', title: 'Session done',
      desc: 'Nothing to log at the session? “Session done” in the session menu marks the day trained, at the session’s time. The menu now reads “Trained 6:30 PM”, and the line can take it back.' },
    { part: 'The evening', img: '19c-wont-fit', clock: '9:45', title: 'Nothing lands on tomorrow', tabs: false,
      desc: '9:45 PM. The shake went in late, and dinner can’t fit before your 9:30 “Last meal by”. It says so and waits to be logged or skipped. No 11:45 PM dinner, and no alert for it.' },
    { part: 'The evening', img: '19d-nothing-fits', clock: '9:45', title: 'Nothing else fits today',
      hot: [TABS.history[0], 795, TABS.history[1], 848], doText: 'Tap History',
      desc: 'When only what can’t happen is left, Today says so and offers to skip the rest in one tap, and one Undo.' },
    { id: 'history', part: 'The evening', img: '26-history', clock: '9:45', title: 'History keeps the record',
      hot: [TABS.plan[0], 795, TABS.plan[1], 848], doText: 'Tap Plan',
      desc: 'Today is on the record as a day in progress, with its stack and what happened. Averages wait until the day is over.' },

    // ── The Plan tab ──
    { id: 'plan', part: 'The Plan tab', img: '20-plan-stacks', clock: '6:42', title: 'Stacks, meals, ingredients',
      hot: [18, 388, 384, 438], doText: 'Tap The Base',
      desc: 'Three shelves. Ingredients make meals, and meals make stacks. The rotation runs one stack each week; kept stacks wait until you add them.' },
    { part: 'The Plan tab', img: '21-stack-detail', clock: '6:42', title: 'A stack',
      hot: [18, 600, 384, 688], doText: 'Tap Paprika chicken box',
      desc: 'A training day and a rest day of meals, with the day’s planned totals. Open a meal to change it.' },
    { part: 'The Plan tab', img: '22-meal-editor', clock: '6:42', title: 'A meal is its ingredients', tabs: false,
      desc: 'Weighed ingredients with their macros. The meal’s totals and the whole day’s update as you edit. The same screen makes fuel.' },
    { part: 'The Plan tab', img: '23-meal-scope', clock: '6:42', title: 'Say how far it goes', tabs: false,
      desc: 'Today only, or every training day of The Base from now on. A meal already logged keeps what it was logged with.' },
    { part: 'The Plan tab', img: '24-plan-meals', clock: '6:42', title: 'The Meals shelf',
      hot: [262, 178, 382, 208], doText: 'Tap Ingredients',
      desc: 'Every meal you keep, searchable by name or by what’s in it. Built-in examples to start from, or bring your own with the MealStack plan skill.' },
    { part: 'The Plan tab', img: '25-plan-ingredients', clock: '6:42', title: 'That’s MealStack',
      desc: 'Per-unit figures for the built-in ingredients, and yours from the label. Timing that bends around your day and protects your session. It’s in private beta on iPhone; the form under this demo gets you a build.' }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var byId = {};
  steps.forEach(function (s, i) { if (s.id) byId[s.id] = i; });
  var parts = [];
  steps.forEach(function (s, i) { if (!parts.length || parts[parts.length - 1].name !== s.part) parts.push({ name: s.part, first: i }); });

  // Preload, so a tap swaps the screen at once.
  var cache = {};
  steps.forEach(function (s) { if (!cache[s.img]) { var im = new Image(); im.src = IMG + s.img + '.webp'; cache[s.img] = im; } });

  var cur = -1, front = 'shot-a';
  function swapImage(name, label) {
    var src = IMG + name + '.webp';
    var a = $(front);
    if (a.getAttribute('src') === src) { a.alt = label; return; }
    var backId = front === 'shot-a' ? 'shot-b' : 'shot-a', b = $(backId);
    b.src = src; b.alt = label;
    b.classList.add('on'); a.classList.remove('on');
    front = backId;
  }
  function box(el, r) {
    el.style.left = r[0] + 'px'; el.style.top = r[1] + 'px';
    el.style.width = (r[2] - r[0]) + 'px'; el.style.height = (r[3] - r[1]) + 'px';
  }
  function renderTargets(s) {
    var t = $('targets');
    t.innerHTML = '';
    if (s.hot) {
      var h = document.createElement('button');
      h.className = 'hot';
      h.setAttribute('aria-label', s.doText || 'Continue');
      box(h, s.hot);
      h.addEventListener('click', next);
      t.appendChild(h);
    }
    if (s.tabs === false) return;
    [['today', 'Today', 'today'], ['plan', 'Plan', 'plan'], ['history', 'History', 'history'], ['coach', 'Coach', 'coach-home']].forEach(function (d) {
      var r = TABS[d[0]];
      if (s.hot && s.hot[1] >= 790 && s.hot[0] === r[0]) return; // the ringed tab is already a target
      var b = document.createElement('button');
      b.className = 'tab';
      b.style.left = r[0] + 'px'; b.style.width = (r[1] - r[0]) + 'px';
      b.setAttribute('aria-label', 'Open ' + d[1]);
      b.addEventListener('click', function () { goTo(byId[d[2]]); });
      t.appendChild(b);
    });
  }
  function renderParts(s) {
    var wrap = $('g-parts');
    if (!wrap.childElementCount) {
      parts.forEach(function (p) {
        var b = document.createElement('button');
        b.className = 'g-part'; b.textContent = p.name;
        b.addEventListener('click', function () { goTo(p.first); });
        wrap.appendChild(b);
      });
    }
    Array.prototype.forEach.call(wrap.children, function (b, i) { b.classList.toggle('on', parts[i].name === s.part); });
  }
  function goTo(n) {
    if (n < 0 || n >= steps.length) return;
    cur = n;
    var s = steps[n];
    swapImage(s.img, s.title);
    $('clock').textContent = s.clock;
    renderTargets(s);
    renderParts(s);
    var p = parts.filter(function (x) { return x.name === s.part; })[0];
    var inPart = steps.filter(function (x) { return x.part === s.part; }).length;
    $('g-counter').textContent = s.part + ' · ' + (n - p.first + 1) + ' of ' + inPart;
    $('g-title').textContent = s.title;
    $('g-desc').textContent = s.desc;
    $('g-do').textContent = s.doText || '';
    $('g-prev').disabled = n === 0;
    $('g-next').textContent = n === steps.length - 1 ? 'Start over' : (s.hot ? 'Do it for me →' : 'Next →');
    if (window.innerWidth <= 720) fit();
  }
  function next() { goTo(cur === steps.length - 1 ? 0 : cur + 1); }
  function prev() { goTo(cur - 1); }

  $('g-prev').addEventListener('click', prev);
  $('g-next').addEventListener('click', next);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });

  /* ── Fit the phone to the frame ── */
  var PW = 422, PH = 894;
  function fit() {
    var col = document.querySelector('.phone-col'), narrow = window.innerWidth <= 720;
    var guideH = narrow ? $('guide').offsetHeight : 0;
    var availH = narrow ? Math.max(380, window.innerHeight - guideH - 28) : window.innerHeight - 36;
    var availW = narrow ? window.innerWidth - 24 : Math.min(window.innerWidth * 0.48, 450) - 30;
    var k = Math.min(availH / PH, availW / PW, 1), sc = $('scale');
    sc.style.transform = 'scale(' + k + ')'; sc.style.width = (PW * k) + 'px'; sc.style.height = (PH * k) + 'px';
    col.style.flexBasis = narrow ? 'auto' : (PW * k + 30) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
  goTo(0);
})();
</script>
</body>
</html>
