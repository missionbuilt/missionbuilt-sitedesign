<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Stack AI, off">
  <!-- StackAIMark .off, dark appearance: all three plates outlined in inkDim 0xA8A094, a 1 pt line
       drawn inside each plate (kept 1 pt at any size, as in the app). -->
